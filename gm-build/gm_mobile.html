<!-- ══════════════════════════════════════════════════════════════
     GM MOBILE LAYER — تطبيق المدير العام = نسخة من لوحة التحكم بشكل موبايل
     (بيشتغل على الشاشات الصغيرة بس ≤ 900px — على الكمبيوتر الشكل زي اللوحة بالظبط)
═══════════════════════════════════════════════════════════════ -->
<style id="gm-mobile-css">
#gm-menu-btn,#gm-cur-title,#gm-drawer,#gm-backdrop{display:none}
@media (max-width:900px){
  html,body{overflow-x:hidden}
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  input,select,textarea{font-size:16px!important}
  /* ── التوب بار ── */
  .sidebar-toprow{gap:8px;padding:calc(6px + env(safe-area-inset-top)) 10px 6px}
  .sidebar-toprow > button[onclick^="downloadDashboard"]{display:none!important}
  .sidebar-logo .icon{font-size:20px}
  .user-info{display:none}
  .user-card{padding:4px 6px}
  #gm-menu-btn{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:42px;height:40px;border-radius:10px;border:none;background:#731E2E;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 3px 10px rgba(115,30,46,.35)}
  #gm-cur-title{display:block;flex:1;min-width:0;font-family:Cairo,sans-serif;font-size:14px;font-weight:800;color:#2C1F0A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #gm-cur-title small{display:block;font-size:10px;font-weight:700;color:#A0896A;line-height:1.1}
  /* ── السايدبارات الأربعة → شريط تحت ── */
  .gm-modebar{position:fixed!important;left:0;right:0;bottom:0;z-index:950;flex:none!important;margin:0!important;border-radius:16px 16px 0 0!important;
    padding:7px 7px calc(7px + env(safe-area-inset-bottom))!important;background:#3D2E0F!important;border:none!important;box-shadow:0 -4px 18px rgba(0,0,0,.25);gap:6px!important;overflow:visible!important}
  .gm-modebar button{font-size:12.5px!important;padding:10px 4px!important;letter-spacing:0!important}
  /* ── الريبون → قايمة جانبية ── */
  .sidebar > .sidebar-nav{display:none!important}
  #gm-backdrop{display:block;position:fixed;inset:0;background:rgba(20,12,4,.5);z-index:1090;opacity:0;pointer-events:none;transition:opacity .2s}
  #gm-drawer{display:flex;flex-direction:column;position:fixed;top:0;bottom:0;right:0;width:min(88vw,360px);z-index:1100;background:#FAF7F2;
    transform:translateX(105%);transition:transform .25s ease;box-shadow:-6px 0 24px rgba(0,0,0,.25);font-family:Cairo,sans-serif}
  body.gm-open #gm-drawer{transform:none}
  body.gm-open #gm-backdrop{opacity:1;pointer-events:auto}
  body.gm-open{overflow:hidden}
  .gm-dhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;background:#731E2E;color:#fff}
  .gm-dhead b{font-size:15px}
  .gm-dhead small{display:block;font-size:10.5px;color:#E8D3A2;font-weight:600}
  .gm-dhead button{background:rgba(255,255,255,.15);border:none;color:#fff;width:36px;height:36px;border-radius:9px;font-size:18px;cursor:pointer}
  #gm-drawer .sidebar-nav{display:block!important;flex:1;overflow-y:auto!important;overflow-x:hidden!important;padding:8px 10px 24px!important;-webkit-overflow-scrolling:touch}
  #gm-drawer .nav-section{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-template-rows:none!important;grid-auto-flow:row!important;grid-auto-columns:auto!important;gap:7px!important;
    padding:10px 2px 12px!important;margin:0!important;border-left:none!important;border-bottom:1.5px solid #E2D9CC}
  #gm-drawer .nav-section[style*="display: none"],#gm-drawer .nav-section[style*="display:none"]{display:none!important}
  #gm-drawer .nav-section:last-child{border-bottom:none}
  #gm-drawer .nav-section-label{grid-row:1!important;grid-column:1 / -1!important;text-align:right!important;font-size:12.5px!important;color:#731E2E!important;margin:0 2px 2px!important;letter-spacing:0!important}
  #gm-drawer .nav-item{grid-row:auto!important;grid-column:auto!important;min-width:0!important;white-space:normal!important;font-size:12px!important;padding:10px 9px 8px!important;line-height:1.3!important}
  #gm-drawer .nav-item[style*="display: none"],#gm-drawer .nav-item[style*="display:none"]{display:none!important}
  /* ── المحتوى ── */
  .content{padding:10px 9px!important;overflow-x:hidden}
  .panel{max-width:100%;overflow-x:hidden}
  .main > .panel,.layout > .panel{padding:10px 9px!important;box-sizing:border-box}
  .layout{min-height:0!important}
  .layout > .main{flex:none!important;min-height:0!important}
  .main > .content{flex:none!important}
  .content:not(:has(> .panel.active)){padding:0!important}
  .card{padding:12px 11px;border-radius:12px}
  .page-header{flex-direction:column;align-items:stretch;margin-bottom:12px}
  .page-header h2{font-size:16px}
  .page-actions{flex-wrap:wrap}
  .stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px}
  .stat-n{font-size:22px}
  .form-grid,.form-grid-3{grid-template-columns:1fr!important}
  /* شبكات وصفوف مكتوبة inline: تتلف على الشاشة الصغيرة بدل ما تتقص */
  .panel [style*="grid-template-columns"]:not(table):not(.gm-keepgrid){grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))!important}
  .panel [style*="display:flex"]:not([style*="nowrap"]):not([style*="overflow"]),.panel [style*="display: flex"]:not([style*="nowrap"]):not([style*="overflow"]){flex-wrap:wrap!important}
  .panel [style*="width:"]:not(table):not(thead):not(tbody):not(tr):not(th):not(td):not(col):not(canvas):not(svg),.panel input,.panel select,.panel textarea{max-width:100%}
  .gm-tscroll{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .gm-tscroll > table{min-width:max-content}
  .gm-tscroll > table th,.gm-tscroll > table td{white-space:nowrap}
  .tab-pills,.rd-tabs-wrap{flex-wrap:nowrap!important;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tab-pill,.rd-tab-btn-seg{white-space:nowrap;flex-shrink:0}
  /* ── النوافذ ── */
  .modal{width:100%!important;max-width:100%!important;max-height:92vh;border-radius:16px 16px 0 0;padding:16px 14px}
  .modal-overlay{align-items:flex-end}
  .modal-box{max-width:100vw!important;width:100%!important}
  /* ── الأزرار العائمة والتنبيهات فوق الشريط ── */
  #float-ai-btn{bottom:calc(76px + env(safe-area-inset-bottom))!important;left:12px!important;width:46px!important;height:46px!important;font-size:21px!important}
  #float-ai-panel{bottom:calc(130px + env(safe-area-inset-bottom))!important;left:8px!important;right:8px!important;width:auto!important;max-height:60vh!important}
  #admin-toast{bottom:calc(80px + env(safe-area-inset-bottom))!important;max-width:92vw}
  /* ── شاشة الدخول ── */
  .login-page{width:100%!important;min-height:100vh!important;grid-template-columns:1fr!important;border-radius:0!important;box-shadow:none!important;border:none!important}
  .login-right{display:none!important}
  .login-left{border-left:none!important;padding:calc(30px + env(safe-area-inset-top)) 22px 30px!important}
  .login-left input[type=text],.login-left input[type=password]{padding:12px 14px!important}
  .login-btn{padding:14px!important;font-size:15px!important}
}
</style>
<script id="gm-mobile-js">
(function(){
  const MQ = window.matchMedia('(max-width:900px)');
  const MODE_NAMES = {coord:'📋 التنسيق', sales:'💰 المبيعات', ai:'🤖 تحليل AI', sys:'⚙️ الضبط'};
  let curMode = 'coord';
  function txt(el){ return el ? (el.textContent||'').replace(/\s+/g,' ').trim() : ''; }
  function setTitle(label, section){
    const t = document.getElementById('gm-cur-title'); if(!t) return;
    t.innerHTML = (section?'<small>'+section.replace(/[<>&]/g,'')+'</small>':'') + (label||'').replace(/[<>&]/g,'');
  }
  function syncTitle(){
    const a = document.querySelector('.sidebar-nav .nav-item.active');
    if(a){ const sec=a.closest('.nav-section'); setTitle(txt(a).replace(/\d+$/,'').trim(), sec?txt(sec.querySelector('.nav-section-label')):''); }
    else setTitle(MODE_NAMES[curMode]||'المدير العام','');
    const ds = document.getElementById('gm-dmode'); if(ds) ds.textContent = MODE_NAMES[curMode]||'';
  }
  function openD(){ document.body.classList.add('gm-open'); syncTitle(); const a=document.querySelector('#gm-drawer .nav-item.active'); if(a) try{ a.scrollIntoView({block:'center'}); }catch(e){} }
  function closeD(){ document.body.classList.remove('gm-open'); }
  window.gmOpenMenu=openD; window.gmCloseMenu=closeD;
  // جداول عريضة: نحطها جوه غلاف بيتسحب يمين وشمال (لو مفيش أصلاً سكرول أفقي حواليها)
  function hasScrollParent(el){
    for(let p=el.parentElement; p && !p.classList.contains('panel') && p!==document.body; p=p.parentElement){
      if(p.classList.contains('gm-tscroll')) return true;
      const o = getComputedStyle(p).overflowX; if(o==='auto'||o==='scroll') return true;
    }
    return false;
  }
  function wrapTables(root){
    if(!MQ.matches) return;
    (root||document).querySelectorAll('.panel table').forEach(tb=>{
      if(tb.dataset.gmw || tb.closest('.gm-tscroll')) return;
      tb.dataset.gmw='1';
      if(hasScrollParent(tb)) return;
      const w=document.createElement('div'); w.className='gm-tscroll';
      tb.parentNode.insertBefore(w,tb); w.appendChild(tb);
    });
  }
  function init(){
    const top = document.querySelector('.sidebar-toprow'), nav = document.querySelector('.sidebar-nav'), mc = document.getElementById('mode-coord');
    if(!top || !nav || !mc || document.getElementById('gm-drawer')) return;
    mc.parentElement.classList.add('gm-modebar');
    // زرار القايمة + اسم التاب الحالي
    const mb=document.createElement('button'); mb.id='gm-menu-btn'; mb.type='button'; mb.title='القايمة'; mb.innerHTML='☰'; mb.onclick=openD;
    const tt=document.createElement('div'); tt.id='gm-cur-title';
    top.insertBefore(tt, top.firstChild); top.insertBefore(mb, top.firstChild);
    // القايمة الجانبية: بننقل الريبون نفسه جواها (نفس الأزرار والصلاحيات والعدادات بالظبط)
    const bd=document.createElement('div'); bd.id='gm-backdrop'; bd.onclick=closeD;
    const dr=document.createElement('div'); dr.id='gm-drawer';
    dr.innerHTML='<div class="gm-dhead"><div><b>القايمة</b><small id="gm-dmode"></small></div><button type="button" onclick="gmCloseMenu()">✕</button></div>';
    document.body.appendChild(bd); document.body.appendChild(dr);
    const place=()=>{ if(MQ.matches){ if(nav.parentElement!==dr) dr.appendChild(nav); } else { const sb=document.querySelector('.sidebar'); if(sb && nav.parentElement!==sb) sb.appendChild(nav); closeD(); } };
    place(); (MQ.addEventListener?MQ.addEventListener('change',()=>{place();wrapTables();}):MQ.addListener(place));
    dr.addEventListener('click',e=>{ const it=e.target.closest('.nav-item'); if(it){ setTimeout(()=>{ syncTitle(); closeD(); },30); } });
    // متابعة تغيير السايدبار والتاب
    if(typeof switchAdminMode==='function'){ const _sm=switchAdminMode; window.switchAdminMode=switchAdminMode=function(m){ curMode=m; const r=_sm.apply(this,arguments); setTimeout(syncTitle,30); return r; }; }
    if(typeof showPanel==='function'){ const _sp=showPanel; window.showPanel=showPanel=function(id){ const r=_sp.apply(this,arguments); setTimeout(()=>{ syncTitle(); wrapTables(document.getElementById('panel-'+id)||undefined); },60); return r; }; }
    const content=document.getElementById('app');
    if(content && window.MutationObserver){ let tm=null; new MutationObserver(()=>{ clearTimeout(tm); tm=setTimeout(()=>wrapTables(),120); }).observe(content,{childList:true,subtree:true}); }
    document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeD(); });
    syncTitle(); wrapTables();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();
</script>
