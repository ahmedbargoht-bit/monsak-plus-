<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الطحان جولدن داتس — شاشة التلفزيون</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:18px}
@media (min-width:1700px){html{font-size:22px}}
@media (max-width:1300px){html{font-size:16px}}
body{background:#14090d;color:#f5ece0;font-family:Cairo,"Segoe UI",Tahoma,Arial,sans-serif;height:100vh;overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:.55rem 1.2rem;background:#1d0e13;border-bottom:2px solid #731E2E}
.brand{display:flex;align-items:center;gap:.7rem}
.brand .logo{width:2.4rem;height:2.4rem;border-radius:50%;background:#731E2E;color:#F0C880;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;border:2px solid #F0C880}
.brand .t1{font-size:1.25rem;font-weight:800;color:#F0C880}
.brand .t2{font-size:.7rem;color:#bfae98}
.meta{text-align:left;direction:ltr;font-size:.75rem;color:#bfae98;line-height:1.5}
.meta .clock{font-size:1.5rem;font-weight:800;color:#fff}
nav{display:flex;flex-wrap:wrap;gap:.6rem;padding:.55rem 1.2rem;background:#14090d}
.tab{font:inherit;font-size:1rem;font-weight:700;padding:.45rem 1.4rem;border-radius:.7rem;border:2px solid #3a1f27;background:#231016;color:#e8d9c4;cursor:pointer}
.tab.active{background:#731E2E;color:#fff;border-color:#F0C880}
.tab:focus{outline:3px solid #F0C880}
.tab .k{font-size:.65rem;opacity:.6;margin-right:.4rem}
.spacer{flex:1}
.btn{font:inherit;font-size:.8rem;padding:.4rem .9rem;border-radius:.6rem;border:2px solid #3a1f27;background:#231016;color:#bfae98;cursor:pointer}
.btn:focus{outline:3px solid #F0C880}
main{flex:1;min-height:0;padding:.4rem 1.2rem .8rem;position:relative}
.view{display:none;height:100%}
.view.active{display:block}
.card{background:#231016;border:1px solid #3a1f27;border-radius:1rem;padding:.7rem 1rem}
.card h3{font-size:.95rem;color:#F0C880;margin-bottom:.5rem;font-weight:700}
.lbl{font-size:.8rem;color:#bfae98}
.num{font-weight:800;line-height:1.15}
.g{color:#4ADE80}.r{color:#F87171}.a{color:#FBBF24}.b{color:#60A5FA}.p{color:#C4B5FD}.w{color:#fff}.y{color:#F0C880}
.grid{display:grid;gap:.7rem}
.kpis4{grid-template-columns:repeat(4,1fr)}
.kpis3{grid-template-columns:repeat(3,1fr)}
.kpis6{grid-template-columns:repeat(6,1fr)}
.kcard{text-align:center;border-top:4px solid #731E2E}
.kcard .num{font-size:2.5rem}
.kcard.s .num{font-size:1.5rem}
.kcard.xl .num{font-size:3rem}
.bar{background:#3a1f27;border-radius:99px;height:.6rem;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:#4ADE80}
table{width:100%;border-collapse:collapse}
th{font-size:.75rem;color:#bfae98;font-weight:600;text-align:right;padding:.3rem .5rem;border-bottom:1px solid #3a1f27}
td{padding:.38rem .5rem;border-bottom:1px solid #2d171e;font-size:.9rem;vertical-align:middle}
.tc{text-align:center}
.pill{display:inline-block;padding:.05rem .6rem;border-radius:99px;font-size:.8rem;font-weight:700}
.pill.g{background:#0f3a24}.pill.r{background:#4a1616}.pill.a{background:#4a3410}.pill.n{background:#33262b;color:#bfae98}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:.7rem}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;height:100%}
.empty{text-align:center;color:#bfae98;padding:2rem 0;font-size:1rem}
#banner{position:fixed;bottom:0;left:0;right:0;background:#7a2a00;color:#fff;font-size:.8rem;text-align:center;padding:.25rem;display:none}
.rank{display:flex;align-items:center;gap:.6rem;padding:.4rem 0;border-bottom:1px solid #2d171e}
.rank .no{width:1.7rem;font-weight:800;color:#F0C880;text-align:center;font-size:1.05rem}
.rank .nm{flex:1;min-width:0}
.rank .nm b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .nm span{font-size:.7rem;color:#bfae98}
.rank .sc{font-size:1.4rem;font-weight:800;width:3.2rem;text-align:left}
.dot{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;background:#555}
.dot.on{background:#4ADE80;box-shadow:0 0 .5rem #4ADE80}
.hint{font-size:.7rem;color:#8d7d70;text-align:center;padding-top:.3rem}
.sv{display:flex;flex-direction:column;height:100%}
.sv>*{flex-shrink:0}
.sv>.fill{flex:1 1 0;min-height:0;grid-template-rows:minmax(0,1fr)}
.locwrap{display:grid;grid-template-columns:1.7fr 1fr;gap:.7rem;height:calc(100% - 7.2rem)}
#loc-map{height:calc(100% - 1.7rem);border-radius:.6rem;overflow:hidden;background:#1d0e13}
.leg{font-size:.7rem;color:#bfae98;font-weight:400;margin-right:.6rem}
.leg i{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;margin:0 .15rem 0 .1rem;vertical-align:middle}
.leaflet-tooltip.tvtip{background:#1d0e13;color:#fff;border:1px solid #F0C880;font:700 12px Cairo,Tahoma,Arial,sans-serif;padding:1px 6px;box-shadow:none}
.leaflet-tooltip-top.tvtip:before{border-top-color:#F0C880}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="logo">ط</div>
      <div><div class="t1">الطحان جولدن داتس</div><div class="t2">شاشة المتابعة</div></div>
    </div>
    <div class="meta"><div class="clock" id="clock">--:--</div><div id="upd">جاري التحميل...</div></div>
  </header>
  <nav id="tabs"></nav>
  <main>
    <section class="view" id="v-hm"></section>
    <section class="view" id="v-lb"></section>
    <section class="view" id="v-loc"></section>
    <section class="view" id="v-sales"></section>
  </main>
  <div id="banner"></div>
</div>

<script>
(function(){
'use strict';
var SB_URL='https://tneeosrbxedexsrigapg.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuZWVvc3JieGVkZXhzcmlnYXBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMTcxMTQsImV4cCI6MjA5NDY5MzExNH0.JHXgJ6EeDcdeofD5HShRnWvwPazCIfY7q7pCC2GMOFw';
var DEMO=/[?&]demo=1/.test(location.search);
var REFRESH_MS=5*60*1000;
var WORK_DAYS=26;
var AR_DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var DAY_KEYS={sunday:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6,'الأحد':0,'الاثنين':1,'الثلاثاء':2,'الأربعاء':3,'الخميس':4,'الجمعة':5,'السبت':6};
var TABS=[{id:'lb',label:'لوحة شرف المنسقين'},{id:'hm',label:'خريطة حرارة الفروع'},{id:'loc',label:'الموقع الحالي'},{id:'sales',label:'المبيعات'}];
var GROUPS={giza:'الجيزة',cairo:'وسط القاهرة',south:'جنوب وشرق القاهرة',tajmuat:'التجمعات',hyper:'الهايبر ماركت',alex:'الإسكندرية',delta:'الدلتا'};
var S={tab:0,data:{},errs:{},page:0,nextAt:0,loading:false,lastOk:0};

/* ───────── أدوات ───────── */
function pad(n){return n<10?'0'+n:''+n}
function fmt(n){return Math.round(n||0).toLocaleString('en-US')}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function $(id){return document.getElementById(id)}
function pctColor(p){return p>=100?'g':p>=70?'a':'r'}
function parseTs(s){if(!s)return new Date(NaN);s=String(s).replace(' ','T').replace(/([+-]\d\d)$/,'$1:00');return new Date(s)}

/* توقيت القاهرة بغض النظر عن إعدادات التلفزيون */
function cairo(){
  try{
    var p=new Intl.DateTimeFormat('en-US',{timeZone:'Africa/Cairo',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric',hour12:false}).formatToParts(new Date());
    var o={};p.forEach(function(x){o[x.type]=+x.value});
    if(o.hour===24)o.hour=0;
    return {y:o.year,m:o.month,d:o.day,h:o.hour,mi:o.minute,s:o.second};
  }catch(e){var n=new Date();return {y:n.getFullYear(),m:n.getMonth()+1,d:n.getDate(),h:n.getHours(),mi:n.getMinutes(),s:n.getSeconds()}}
}
function isoOf(y,m,d){return y+'-'+pad(m)+'-'+pad(d)}
function addDays(y,m,d,k){var t=new Date(Date.UTC(y,m-1,d+k));return {y:t.getUTCFullYear(),m:t.getUTCMonth()+1,d:t.getUTCDate(),dow:t.getUTCDay()}}
function dowOf(y,m,d){return new Date(Date.UTC(y,m-1,d)).getUTCDay()}
function cairoMidnightUtcIso(c){
  var off=Date.UTC(c.y,c.m-1,c.d,c.h,c.mi,c.s)-Date.now();
  return new Date(Date.UTC(c.y,c.m-1,c.d)-off).toISOString();
}

/* ───────── الاتصال بـ Supabase ───────── */
function fetchJson(path){
  return new Promise(function(resolve,reject){
    var done=false,t=setTimeout(function(){if(!done){done=true;reject(new Error('timeout'))}},30000);
    fetch(SB_URL+'/rest/v1/'+path,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}}).then(function(r){
      if(!r.ok)throw new Error('HTTP '+r.status);return r.json();
    }).then(function(j){if(!done){done=true;clearTimeout(t);resolve(j)}}).catch(function(e){if(!done){done=true;clearTimeout(t);reject(e)}});
  });
}
function get(path){return DEMO?Promise.resolve(demoGet(path)):fetchJson(path)}
function getAll(path){
  var all=[],off=0;
  function step(){
    return get(path+'&limit=1000&offset='+off).then(function(page){
      if(!page||!page.length)return all;
      all=all.concat(page);
      if(page.length<1000||all.length>=60000)return all;
      off+=1000;return step();
    });
  }
  return DEMO?get(path):step();
}

/* ───────── تحميل البيانات ───────── */
function loadToday(){
  var c=cairo(),iso=isoOf(c.y,c.m,c.d),us=c.m+'/'+c.d+'/'+c.y;
  var dq='in.('+iso+','+encodeURIComponent(us)+')';
  var startUtc=cairoMidnightUtcIso(c);
  return Promise.all([
    getAll('visits?select=id,name,grp,branch,points,date&date='+dq+'&order=id.asc'),
    getAll('attendance?select=id,name,grp,date,time_in,time_out&date='+dq+'&order=id.asc'),
    getAll('missing?select=id,name,branch,snf,reason,grp,created_at&created_at=gte.'+startUtc+'&order=id.asc'),
    get('location?select=name,grp,updated_at,branch,lat,lng&limit=1000'),
    get('users?select=name,grp,user_type,route,day_off&role=eq.rep&status=eq.active&limit=1000'),
    get('groups?select=key_name,name,emoji&limit=200').catch(function(){return []})
  ]).then(function(r){
    (r[5]||[]).forEach(function(g){if(g.key_name&&g.name)GROUPS[g.key_name]=g.name});
    return {visits:r[0]||[],attendance:r[1]||[],missing:r[2]||[],location:r[3]||[],users:r[4]||[],c:c,iso:iso};
  });
}
function loadSup(){
  var c=cairo(),mIso=cairoMidnightUtcIso({y:c.y,m:c.m,d:1,h:c.h,mi:c.mi,s:c.s}),tIso=cairoMidnightUtcIso(c);
  return getAll('field_support_logs?select=supervisor_name,rep_name,branch_name,grp,created_at&created_at=gte.'+mIso+'&order=id.asc').then(function(r){return {logs:r||[],todayIso:tIso}}).catch(function(){return {logs:[],todayIso:tIso}});
}
function loadLb(){
  return get('tv_snapshots?select=key,payload,updated_at&key=like.'+encodeURIComponent('leaderboard:*')).then(function(rows){
    var o={};(rows||[]).forEach(function(r){o[r.key.replace('leaderboard:','')]=r});return o;
  });
}
function loadMt(monthStart,today){
  /* تاريخ القطع = آخر تاريخ فاتورة دخلت MT. لحد التاريخ ده المصدر فواتير MT (بعد خصم المرتجع)، وبعده مبيعات المناديب */
  return get('tamr_sales_invoices?select=invoice_date&order=invoice_date.desc&limit=1').then(function(r){
    var cut=(r&&r[0]&&r[0].invoice_date)?String(r[0].invoice_date).slice(0,10):null;
    if(!cut)return {cut:null,inv:[],ret:[]};
    var end=today<cut?today:cut;
    if(monthStart>end)return {cut:cut,inv:[],ret:[]};
    var rng='&invoice_date=gte.'+monthStart+'&invoice_date=lte.'+end+'&order=id.asc';
    return Promise.all([
      getAll('tamr_sales_invoices?select=customer_site,customer,invoice_date,net,gross,discount'+rng),
      getAll('tamr_sales_returns?select=customer,invoice_date,total'+rng)
    ]).then(function(x){return {cut:cut,inv:x[0]||[],ret:x[1]||[]}});
  }).catch(function(){return {cut:null,inv:[],ret:[]}});
}
function loadSales(){
  var c=cairo(),month=c.y+'-'+pad(c.m),monthStart=month+'-01';
  var wk=addDays(c.y,c.m,c.d,-6),weekStart=isoOf(wk.y,wk.m,wk.d);
  var from=weekStart<monthStart?weekStart:monthStart;
  var today=isoOf(c.y,c.m,c.d);
  return Promise.all([
    getAll('sales_deliveries?select=rep_name,branch_name,grp,total_net,total_tax,delivery_date&deleted_at=is.null&delivery_date=gte.'+from+'&delivery_date=lte.'+today+'&order=id.asc'),
    getAll('sales_returns?select=rep_name,branch_name,grp,total_net,total_tax,return_date&deleted_at=is.null&return_date=gte.'+from+'&return_date=lte.'+today+'&order=id.asc'),
    get('rep_targets?select=rep_name,supervisor_name,target_amount&month=eq.'+month+'&limit=1000'),
    get('rep_achieved_overrides?select=rep_name,amount,range_to&month=eq.'+month).catch(function(){return []}),
    get('users?select=name,supervisors&role=eq.sales&level=eq.rep&limit=1000').catch(function(){return []}),
    getAll('branches?select=branch_name,grp&status=eq.active&order=id.asc').catch(function(){return []}),
    loadMt(monthStart,today),
    getAll('tamr_sales_rep_routes?select=branch_name,route,group_name&order=id.asc').catch(function(){return []}),
    get('users?select=name,grp&role=eq.sales&level=eq.rep&status=eq.active&limit=1000').catch(function(){return []}),
    get('sales_goal_discounts?select=cairo_discount,alex_discount&month=eq.'+month).catch(function(){return []})
  ]).then(function(r){return {disc:(r[9]&&r[9][0])||null,ug:r[8]||[],rr:r[7]||[],del:r[0]||[],ret:r[1]||[],tgt:r[2]||[],ovr:r[3]||[],usr:r[4]||[],br:r[5]||[],mt:r[6]||{cut:null,inv:[],ret:[]},c:c,month:month,monthStart:monthStart,today:today}});
}
function refresh(){
  if(S.loading)return;S.loading=true;
  var jobs=[['today',loadToday],['lb',loadLb],['sup',loadSup],['sales',loadSales]];
  Promise.all(jobs.map(function(j){
    return j[1]().then(function(d){S.data[j[0]]=d;delete S.errs[j[0]]}).catch(function(e){S.errs[j[0]]=e&&e.message||'خطأ'});
  })).then(function(){
    S.loading=false;S.nextAt=Date.now()+REFRESH_MS;
    if(Object.keys(S.errs).length<jobs.length)S.lastOk=Date.now();
    var bad=Object.keys(S.errs);
    var b=$('banner');
    if(bad.length){b.style.display='block';b.textContent='تعذّر تحديث بعض البيانات ('+bad.join('، ')+') — بيتم عرض آخر بيانات وصلت';}else b.style.display='none';
    renderAll();
  });
}

/* ───────── الداشبورد ───────── */
function repsExpected(d){
  var dow=d.c?dowOf(d.c.y,d.c.m,d.c.d):-1;
  var present={};d.attendance.forEach(function(a){if(a.time_in)present[a.name]=1});
  return d.users.filter(function(u){
    var off=DAY_KEYS[String(u.day_off||'').toLowerCase()];if(off==null)off=DAY_KEYS[u.day_off];
    return !(off!=null&&off===dow&&!present[u.name]);
  });
}
/* ───────── خريطة حرارة الفروع (نفس منطق لوحة التحكم: قيمة فواتير التوريد بدون ضريبة — الشهر الحالي) ───────── */
var HM_COLORS=['#EFF6FF','#BFDBFE','#60A5FA','#2563EB','#1D4ED8','#1E3A8A'];
var HM_GRP_COLORS={other:'#9CA3AF',giza:'#F87171',cairo:'#60A5FA',south:'#4ADE80',tajmuat:'#FB923C',hyper:'#C084FC',alex:'#38BDF8',delta:'#FACC15',private_cairo:'#D97706',private_chains_cairo:'#D97706',private_chains_giza:'#D97706'};
var HM_GRP_LBL={other:'غير مصنّف',private_cairo:'الأسواق الخاصة',private_chains_cairo:'سلاسل الأسواق الخاصة القاهرة',private_chains_giza:'سلاسل الأسواق الخاصة الجيزة'};
function hmGrpLabel(g){return HM_GRP_LBL[g]||GROUPS[g]||g||'أخرى'}
function hmNorm(x){
  return String(x==null?'':x).toLowerCase()
    .replace(/[ً-ْـ]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/[^ء-يa-z0-9]/g,'');
}
function hmNextDay(iso){var p=iso.split('-');var t=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]+1));return t.getUTCFullYear()+'-'+pad(t.getUTCMonth()+1)+'-'+pad(t.getUTCDate())}
function hmRrGrp(gn,route){
  gn=String(gn||'');route=String(route||'');
  if(gn.indexOf('أسواق خاصة')>=0)return route.indexOf('الجيزة')>=0?'private_chains_giza':'private_chains_cairo';
  if(gn.indexOf('الجيزة')>=0)return 'giza';
  if(gn.indexOf('الإسكندرية')>=0||gn.indexOf('الاسكندرية')>=0)return 'alex';
  if(gn.indexOf('جنوب')>=0)return 'south';
  if(gn.indexOf('التجمعات')>=0)return 'tajmuat';
  if(gn.indexOf('وسط')>=0)return 'cairo';
  if(gn.indexOf('الهايبر')>=0)return 'hyper';
  if(gn.indexOf('الدلتا')>=0)return 'delta';
  if(gn.indexOf('الصعيد')>=0)return 'upper_egypt';
  if(gn.indexOf('الغردقه')>=0)return 'hurghada';
  return 'other';
}
var HM_SITE_ALIAS=[['هايبر وان - مدينة بدر','هايبر وان بدر'],['هايبر وان - هايبر زايد','هايبروان زايد'],['هايبر وان - هايبر سفنكس','هايبر وان سفنكس'],['مهدى عرفه','كارفور مهدى عرفه'],['جملة ماركت - اللاسلكي','جمله ماركت المعادي ( اللاسلكي )'],['جمله ماركت منشا','جمله ماركت -المنشا'],['اسواق فتح الله العجمى ستار','أسواق فتح الله-عجمي ستار'],['الهوارى ماركت - ميدان لبنان','الهواري']];
function hmGroups(){
  var d=S.data.sales;if(!d)return null;
  /* الخريطة = فواتير MT لحد آخر تاريخ فاتورة دخلت MT (صافي بعد خصم المرتجع) + مبيعات المناديب بعد التاريخ ده */
  var idx={};
  (d.br||[]).forEach(function(b){
    var nm=String(b.branch_name||'').trim(),k=hmNorm(nm);
    if(!k||!b.grp||idx[k])return;
    idx[k]={name:nm,grp:b.grp==='private_cairo'?'private_chains_cairo':b.grp};
  });
  HM_SITE_ALIAS.forEach(function(p){var t=idx[hmNorm(p[1])],sk=hmNorm(p[0]);if(t&&!idx[sk])idx[sk]=t});
  (d.rr||[]).forEach(function(r){var nm=String(r.branch_name||'').trim(),k=hmNorm(nm);if(!k||idx[k])return;idx[k]={name:nm,grp:hmRrGrp(r.group_name,r.route)}});
  function resolve(site){
    var raw=String(site||'').trim();if(!raw)return null;
    var h=idx[hmNorm(raw)];
    return h?{name:h.name,grp:h.grp}:{name:raw,grp:'other'};
  }
  var m={};
  function ens(n,g){var k=String(n).trim();var o=m[k]||(m[k]={branch:k,grp:'',gross:0,ret:0,inv:0});if(!o.grp&&g)o.grp=g;return o}
  var mt=d.mt||{cut:null,inv:[],ret:[]},cut=mt.cut;
  /* مبيعات MT + توزيع المرتجع نسبيًا (مرتجع MT مسجل بالعميل مش بالفرع) */
  var custSites={};
  mt.inv.forEach(function(r){
    var g=Number(r.gross)||0,ds=Number(r.discount)||0;

   (slice.length?slice.map(function(r){
     return '<tr><td><b>'+esc(r.name)+'</b></td>'+

   }).join(''):'<tr><td colspan="4" class="empty">لا توجد بيانات</td></tr>')+

/* ───────── المبيعات (Sales Dashboard + مبيعات اليوم) ───────── */
function net(r){return (+r.total_net||0)-(+r.total_tax||0)}
function computeSales(d){
  var c=d.c,today=d.today,mStart=d.monthStart;
  var repNet={},todaySales=0,todayRet=0,days={};
  for(var i=6;i>=0;i--){var x=addDays(c.y,c.m,c.d,-i);days[isoOf(x.y,x.m,x.d)]={s:0,r:0,dow:x.dow,d:x.d,m:x.m}}
  var delBy={},retBy={};
  d.del.forEach(function(r){
    var dt=r.delivery_date,v=net(r);
    if(days[dt])days[dt].s+=v;
    if(dt===today)todaySales+=v;
    if(dt>=mStart){repNet[r.rep_name]=(repNet[r.rep_name]||0)+v;(delBy[r.rep_name]=delBy[r.rep_name]||[]).push(r)}
  });
  d.ret.forEach(function(r){
    var dt=r.return_date,v=net(r);
    if(days[dt])days[dt].r+=v;
    if(dt===today)todayRet+=v;
    if(dt>=mStart){repNet[r.rep_name]=(repNet[r.rep_name]||0)-v;(retBy[r.rep_name]=retBy[r.rep_name]||[]).push(r)}
  });
  // تعديل يدوي على "المحقق": الرقم أساس لحد تاريخ القطع، وأي فاتورة بعده بتتضاف فوقه (نفس منطق لوحة التحكم)
  var monthEnd=d.month+'-31';
  d.ovr.forEach(function(o){
    var cut=o.range_to||monthEnd,after=0;
    (delBy[o.rep_name]||[]).forEach(function(r){if((r.delivery_date||'')>cut)after+=net(r)});
    (retBy[o.rep_name]||[]).forEach(function(r){if((r.return_date||'')>cut)after-=net(r)});
    repNet[o.rep_name]=(+o.amount||0)+after;
  });
  /* خصومات العملاء: بتتوزع على مناديب كل إقليم بنسبة مبيعاتهم (نفس لوحة التحكم) */
  var grossAch=0;Object.keys(repNet).forEach(function(k){grossAch+=repNet[k]});
  var dsc=d.disc||{},dCa=+dsc.cairo_discount||0,dAl=+dsc.alex_discount||0,discApplied=0;
  if(dCa>0||dAl>0){
    var rgOf={};(d.ug||[]).forEach(function(u){rgOf[u.name]=(u.grp==='alex'?'alex':'cairo')});
    var rbase={cairo:0,alex:0};
    Object.keys(repNet).forEach(function(n){if(rgOf[n])rbase[rgOf[n]]+=Math.max(0,repNet[n])});
    var dd={cairo:dCa,alex:dAl};
    Object.keys(repNet).forEach(function(n){
      var rg=rgOf[n];if(!rg||!(dd[rg]>0)||!(rbase[rg]>0))return;
      var sh=dd[rg]*Math.max(0,repNet[n])/rbase[rg];repNet[n]-=sh;discApplied+=sh;
    });
  }
  var achieved=0;Object.keys(repNet).forEach(function(k){achieved+=repNet[k]});
  var target=0,supT={},supA={},repSup={};
  // المشرف الفعلي من users.supervisors (زي لوحة التحكم) — عمود rep_targets.supervisor_name ممكن يكون قديم
  var usrSup={};(d.usr||[]).forEach(function(u){var s=String(u.supervisors||'').split(',')[0].replace(/^\s+|\s+$/g,'');if(s)usrSup[u.name]=s});
  d.tgt.forEach(function(t){
    var v=+t.target_amount||0,sup=usrSup[t.rep_name]||t.supervisor_name||'غير محدد';
    target+=v;supT[sup]=(supT[sup]||0)+v;repSup[t.rep_name]=sup;
  });
  Object.keys(repNet).forEach(function(rn){var sup=repSup[rn];if(sup)supA[sup]=(supA[sup]||0)+repNet[rn]});
  var passed=0;for(var k=1;k<=c.d;k++){if(dowOf(c.y,c.m,k)!==5)passed++}
  var daily=target/WORK_DAYS,required=daily*passed;
  var todayNet=todaySales-todayRet;
  var sups=Object.keys(supT).map(function(s){return {name:s,target:supT[s],ach:supA[s]||0,pct:supT[s]>0?(supA[s]||0)/supT[s]*100:0}}).sort(function(a,b){return b.pct-a.pct});
  return {discApplied:discApplied,discPct:grossAch>0?discApplied/grossAch*100:0,days:days,todaySales:todaySales,todayRet:todayRet,todayNet:todayNet,achieved:achieved,target:target,passed:passed,
    daily:daily,required:required,pct:target>0?achieved/target*100:0,
    todayPct:daily>0?todayNet/daily*100:0,monthPct:passed/WORK_DAYS*100,
    expPct:(passed>0&&target>0)?(achieved/passed*WORK_DAYS)/target*100:0,remaining:target-achieved,sups:sups};
}
function drawChart(cv,days){
  if(!cv||!cv.getContext)return;
  var dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;
  cv.width=w*dpr;cv.height=h*dpr;
  var c=cv.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,w,h);
  var small=h<170;
  var keys=Object.keys(days).sort(),n=keys.length,top=small?20:34,bot=40,ch=Math.max(h-top-bot,10),gw=w/n;
  var max=1;keys.forEach(function(k){if(days[k].s>max)max=days[k].s});
  c.strokeStyle='#3a1f27';c.lineWidth=1;
  for(var g=0;g<=4;g++){var y=top+ch-ch*g/4;c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}
  keys.forEach(function(k,i){
    var dd=days[k],cx=w-(i+0.5)*gw,bw=gw*0.26;
    var hs=ch*dd.s/max,hr=ch*dd.r/max;
    c.fillStyle='#4ADE80';c.fillRect(cx-bw-2,top+ch-hs,bw,hs);
    c.fillStyle='#F87171';c.fillRect(cx+2,top+ch-hr,bw,hr);
    var nv=dd.s-dd.r;
    c.textAlign='center';c.font='bold 15px sans-serif';c.fillStyle='#F0C880';
    c.fillText(fmt(nv),cx,top+ch-Math.max(hs,hr)-8);
    c.font='14px sans-serif';c.fillStyle=(k===keys[n-1])?'#fff':'#bfae98';
    c.fillText(AR_DAYS[dd.dow],cx,h-20);c.fillText(dd.d+'/'+dd.m,cx,h-3);
  });
  if(small)return;
  c.textAlign='right';c.font='13px sans-serif';
  c.fillStyle='#4ADE80';c.fillText('● مبيعات',w-4,16);c.fillStyle='#F87171';c.fillText('● مرتجع',w-80,16);c.fillStyle='#F0C880';c.fillText('الرقم فوق العمود = الصافي',w-170,16);
}
function renderSales(){
  var el=$('v-sales'),d=S.data.sales;
  if(!d){el.innerHTML='<div class="empty">جاري التحميل...</div>';return}
  var s=computeSales(d);
  function card(cls,color,lbl,val,vc){return '<div class="card kcard '+cls+'" style="border-top-color:'+color+'"><div class="lbl">'+lbl+'</div><div class="num '+vc+'">'+val+'</div></div>'}
  function prog(lbl,p,col){return '<div style="flex:1"><div style="display:flex;justify-content:space-between;margin-bottom:.25rem"><span class="lbl">'+lbl+'</span><b class="'+pctColor(p)+'" style="font-size:.95rem">'+Math.round(p)+'%</b></div><div class="bar"><i style="width:'+Math.min(p,100)+'%;background:'+col+'"></i></div></div>'}
  var supHtml=s.sups.length?s.sups.slice(0,7).map(function(x){
    var col=x.pct>=100?'#4ADE80':x.pct>=70?'#FBBF24':'#F87171';
    return '<div style="margin-bottom:.5rem"><div style="display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:.15rem"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%">'+esc(x.name)+'</span><b style="color:'+col+'">'+Math.round(x.pct)+'%</b></div><div class="bar" style="height:.45rem"><i style="width:'+Math.min(x.pct,100)+'%;background:'+col+'"></i></div></div>';
  }).join(''):'<div class="empty">لا توجد أهداف مسجلة لهذا الشهر</div>';
  el.innerHTML='<div class="sv">'+
   '<div class="card" style="display:flex;gap:1.6rem;align-items:center;margin-bottom:.6rem;padding:.55rem 1rem">'+
     '<div class="pill" style="background:#731E2E;color:#fff;font-size:.95rem;padding:.3rem .9rem">يوم '+s.passed+' من '+WORK_DAYS+'</div>'+
     prog('تقدم الشهر',s.monthPct,'#B04A5E')+prog('تحقيق الهدف الكلي',s.pct,s.pct>=100?'#4ADE80':s.pct>=70?'#FBBF24':'#F87171')+prog('تحقيق هدف اليوم',s.todayPct,s.todayPct>=100?'#4ADE80':s.todayPct>=70?'#FBBF24':'#F87171')+
   '</div>'+
   '<div class="grid kpis3" style="margin-bottom:.6rem">'+
     card('','#4ADE80','💰 مبيعات اليوم (توريد)',fmt(s.todaySales),'g')+
     card('','#F87171','↩️ مرتجع اليوم',fmt(s.todayRet),'r')+
     card('','#F0C880','✅ صافي البيع اليوم',fmt(s.todayNet),'y')+
   '</div>'+
   '<div class="grid kpis6" style="margin-bottom:.6rem">'+
     card('s','#731E2E','الهدف الكلي',fmt(s.target),'w')+
     card('s','#60A5FA','المحقق حتى الآن'+(s.discApplied>0?'<div style="font-size:.6rem;color:#FBBF24;font-weight:700;margin-top:.1rem">بعد خصومات العملاء '+fmt(s.discApplied)+' ج ('+s.discPct.toFixed(1)+'% من المبيعات)</div>':''),fmt(s.achieved),'b')+
     card('s','#D97706','المطلوب حتى اليوم',fmt(s.required),'a')+
     card('s','#C4B5FD','المتوقع نهاية الشهر',Math.round(s.expPct)+'%',pctColor(s.expPct))+
     card('s','#F87171','الباقي من الهدف',fmt(Math.max(s.remaining,0)),'r')+
     card('s','#4ADE80','نسبة التحقيق',Math.round(s.pct)+'%',pctColor(s.pct))+
   '</div>'+
   '<div class="two fill">'+
     '<div class="card" style="display:flex;flex-direction:column;overflow:hidden;min-height:0"><h3>آخر 7 أيام — مبيعات ومرتجع</h3><div style="flex:1;min-height:0;position:relative"><canvas id="ch7" style="position:absolute;top:0;left:0;width:100%;height:100%;display:block"></canvas></div></div>'+
     '<div class="card" style="overflow:hidden;min-height:0"><h3>تحقيق الهدف حسب المشرف</h3>'+supHtml+'</div>'+
   '</div></div>';
  drawChart($('ch7'),s.days);
}

/* ───────── التنقل والعرض ───────── */
var RENDER={hm:renderHm,lb:renderLb,loc:renderLoc,sales:renderSales};
function renderAll(){
  TABS.forEach(function(t,i){var v=$('v-'+t.id);if(i===S.tab)v.className='view active';else v.className='view'});
  RENDER[TABS[S.tab].id]();
  var b=document.querySelectorAll('.tab');
  for(var i=0;i<b.length;i++){b[i].className='tab'+(i===S.tab?' active':'')}
  updMeta();
}
function go(i){
  if(i<0)i=TABS.length-1;if(i>=TABS.length)i=0;
  S.tab=i;S.page=0;renderAll();
  var b=document.querySelectorAll('.tab');if(b[i])b[i].focus();
}
function buildTabs(){
  var h='';TABS.forEach(function(t,i){h+='<button class="tab" data-i="'+i+'">'+t.label+'<span class="k">'+(i+1)+'</span></button>'});
  h+='<div class="spacer"></div><button class="btn" id="btnRef">⟳ تحديث الآن</button><button class="btn" id="btnFs">⛶ ملء الشاشة</button>';
  $('tabs').innerHTML=h;
  var b=document.querySelectorAll('.tab');
  for(var i=0;i<b.length;i++)(function(i){b[i].onclick=function(){go(i)}})(i);
  $('btnRef').onclick=function(){refresh()};
  $('btnFs').onclick=toggleFs;
}
function toggleFs(){
  var e=document.documentElement;
  try{
    if(!document.fullscreenElement&&!document.webkitFullscreenElement){(e.requestFullscreen||e.webkitRequestFullscreen||function(){}).call(e)}
    else{(document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document)}
  }catch(x){}
}
document.addEventListener('keydown',function(e){
  var k=e.key,c=e.keyCode;
  // التابات مرتبة من اليمين للشمال: السهم الشمال = التالي
  if(k==='ArrowLeft'||c===37){go(S.tab+1);e.preventDefault()}
  else if(k==='ArrowRight'||c===39){go(S.tab-1);e.preventDefault()}
  else if(k==='ArrowDown'||c===40){var tid=TABS[S.tab].id;if(tid==='loc'){S.page++;renderLoc();e.preventDefault()}else if(tid==='hm'){S.page=(S.page+1)%Math.max(1,HM_PAGES);renderHm();e.preventDefault()}else if(tid==='lb'){S.page=(S.page+1)%Math.max(1,LB_PAGES);renderLb();e.preventDefault()}}
  else if(k==='ArrowUp'||c===38){var tid2=TABS[S.tab].id;if(tid2==='loc'){S.page=Math.max(0,S.page-1);renderLoc();e.preventDefault()}else if(tid2==='hm'){S.page=(S.page-1+Math.max(1,HM_PAGES))%Math.max(1,HM_PAGES);renderHm();e.preventDefault()}else if(tid2==='lb'){S.page=(S.page-1+Math.max(1,LB_PAGES))%Math.max(1,LB_PAGES);renderLb();e.preventDefault()}}
  else if(k>='1'&&k<='4'){go(+k-1)}
  else if(k==='r'||k==='R'){refresh()}
  else if(k==='f'||k==='F'){toggleFs()}
});
function updMeta(){
  var c=cairo();
  $('clock').textContent=pad(c.h)+':'+pad(c.mi);
  var left=Math.max(0,Math.round((S.nextAt-Date.now())/1000));
  var lastTxt=S.lastOk?('آخر تحديث '+pad(new Date(S.lastOk).getHours())+':'+pad(new Date(S.lastOk).getMinutes())):'جاري التحميل...';
  $('upd').textContent=lastTxt+(S.nextAt?' • التالي بعد '+Math.floor(left/60)+':'+pad(left%60):'');
}
setInterval(updMeta,1000);
setInterval(function(){if(S.nextAt&&Date.now()>=S.nextAt)refresh()},5000);
// تقليب صفحات جدول الموقع الحالي تلقائيًا
setInterval(function(){
  if(TABS[S.tab].id!=='loc'||!S.data.today)return;
  var pages=Math.ceil(locRows().length/LOC_PAGE);
  if(pages>1){S.page=(S.page+1)%pages;renderLoc()}
},12000);
setInterval(function(){
  if(TABS[S.tab].id!=='hm'||!S.data.sales)return;
  if(HM_PAGES>1){S.page=(S.page+1)%HM_PAGES;renderHm()}
},15000);
setInterval(function(){
  if(TABS[S.tab].id!=='lb'||!S.data.lb)return;
  if(LB_PAGES>1){S.page=(S.page+1)%LB_PAGES;renderLb()}
},15000);
window.addEventListener('resize',function(){var t=TABS[S.tab].id;if(t==='sales')renderSales();else if(t==='hm')renderHm();else if(t==='lb')renderLb()});

/* ───────── وضع تجريبي (?demo=1) لمعاينة الشكل بدون اتصال ───────── */
function demoGet(path){
  var c=cairo(),iso=isoOf(c.y,c.m,c.d);
  var names=['أحمد سيد','محمود حمدي','منى حسن','سيف ياسر','معاذ أحمد','بدر محروس','حمزة محمود','محمد عماد','علي مصطفى','إسلام فتحي','هبة عادل','كريم وليد'];
  var branches=['كارفور سيتي سنتر','أوسكار التجمع','جملة ماركت','العثيم الحي التاسع','كارفور المعادي','سبينيس الدقي'];
  var grps=['hyper','giza','south','tajmuat','alex'];
  var snfs=['علبة تمر الطحان 1 كجم','تمر مجدول 500 جم جامبو','تمر سعودي 400 جم','عجوة المدينة 250 جم','كيس تمر ش فراوله 90 جم'];
  if(path.indexOf('visits?')===0)return names.map(function(n,i){return {id:i,name:n,grp:grps[i%5],branch:branches[i%6],points:5,date:iso}});
  if(path.indexOf('attendance?')===0)return names.slice(0,9).map(function(n,i){return {id:i,name:n,grp:grps[i%5],date:iso,time_in:pad(8+i%3)+':'+pad(i*5%60),time_out:i%3===0?'15:30':null}});
  if(path.indexOf('missing?')===0){var o=[];for(var i=0;i<26;i++)o.push({id:i,name:names[i%12],branch:branches[i%6],snf:snfs[i%5],reason:['لا يوجد','نفد','متأخر'][i%3],grp:grps[i%5],created_at:new Date().toISOString()});return o}
  if(path.indexOf('location?')===0)return names.slice(0,5).map(function(n,i){return {name:n,grp:grps[i%5],updated_at:new Date(Date.now()-i*i*600000).toISOString(),branch:branches[i%6],lat:30.04+i*0.03,lng:31.23+i*0.04}});
  if(path.indexOf('users?')===0)return names.map(function(n,i){return {name:n,grp:grps[i%5],user_type:'متحرك',route:'خط '+(i+1),day_off:'none'}});
  if(path.indexOf('groups?')===0)return [];
  if(path.indexOf('tv_snapshots?')===0){
    function mk(t){return {key:'leaderboard:'+t,updated_at:new Date(Date.now()-3*36e5).toISOString(),payload:{rows:names.map(function(n,i){return {name:n,route:'خط '+(i+1),group:grps[i%5],score:Math.max(35,92-i*5-(t.length%4))}})}}}
    return [mk('متحرك'),mk('ثابت'),mk('ثابت كبار عملاء')];
  }
  if(path.indexOf('sales_deliveries?')===0||path.indexOf('sales_returns?')===0){
    var isDel=path.indexOf('sales_deliveries')===0,o2=[];
    for(var d=6;d>=0;d--){var x=addDays(c.y,c.m,c.d,-d),ds=isoOf(x.y,x.m,x.d);
      for(var j=0;j<12;j++){var v=isDel?(20000+((j*7919+d*104729)%90000)):(1500+((j*3571+d*7)%9000));
        var r={rep_name:names[j],branch_name:'فرع '+((j*5+d)%23),grp:grps[j%5],total_net:v*1.05,total_tax:v*0.05};r[isDel?'delivery_date':'return_date']=ds;o2.push(r)}}
    return o2;
  }
  if(path.indexOf('branches?')===0){var bo=[];for(var q=0;q<30;q++)bo.push({branch_name:'فرع '+q,grp:grps[q%5]});return bo}
  if(path.indexOf('rep_targets?')===0)return names.map(function(n,i){return {rep_name:n,supervisor_name:['عبد العظيم','محمد صلاح','خالد سمير','أحمد رمضان'][i%4],target_amount:1200000}});
  return [];
}

})();
