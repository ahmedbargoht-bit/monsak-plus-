# بناء تطبيق المدير العام (gm-app.html) أوتوماتيك من لوحة التحكم (mansek-admin.html)
# كل ما ترفع mansek-admin.html جديد → GitHub بيبني gm-app.html ويحفظه لوحده
name: بناء تطبيق المدير العام

on:
  push:
    paths:
      - 'mansek-admin.html'
      - 'gm-build/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-gm
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: بناء gm-app.html
        run: python3 gm-build/build_gm.py mansek-admin.html gm-app.html

      - name: حفظ النسخة الجديدة
        run: |
          if git diff --quiet -- gm-app.html; then
            echo "gm-app.html متغيرش — مفيش حاجة تتحفظ"
            exit 0
          fi
          git config user.name  "gm-app-builder"
          git config user.email "gm-app-builder@users.noreply.github.com"
          git add gm-app.html
          git commit -m "تحديث تلقائي: gm-app.html من mansek-admin.html"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: تحديث الموقع (GitHub Pages)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
